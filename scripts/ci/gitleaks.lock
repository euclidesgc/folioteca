# Versão de gitleaks que o CI instala, e o sha256 do binário de release para
# linux_x64 copiado do gitleaks_<versao>_checksums.txt publicado na mesma
# release. Fixar os dois é o que separa "a ferramenta que revisamos" de "o que
# a tag apontava hoje": tag de git se move, e um binário de procedência não
# confirmada roda sobre a árvore inteira depois do checkout que já gravou o
# token no disco.
#
# Para subir de versão: baixe o checksums.txt da release nova, troque as três
# linhas abaixo, e rode `bash scripts/ci/instalar-gitleaks.sh` — ele recusa
# antes de extrair se a soma não bater.
versao=8.30.1
arquivo=gitleaks_8.30.1_linux_x64.tar.gz
