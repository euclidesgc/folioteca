version: 2

secret:
  ignored-paths:
    # Skills do plugin generic-harness, copiadas para dentro do projeto pelo
    # `init`. Elas trazem exemplos deliberadamente errados de teste, e um deles
    # preenche um campo de senha com uma constante de fachada. É material
    # didático versionado, não credencial: nenhum valor daqui abre coisa alguma.
    #
    # O literal NÃO é reproduzido aqui de propósito. A primeira versão deste
    # arquivo o citava para explicar por que não era segredo, e virou ela
    # própria o achado do scanner — documentar o valor reintroduz o valor.
    #
    # A exclusão é estreita: `.claude/agents/`, `scripts/` e todo o código de
    # produto continuam varridos.
    - ".claude/skills/**"
