services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: folioteca
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: folioteca
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folioteca -d folioteca"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
