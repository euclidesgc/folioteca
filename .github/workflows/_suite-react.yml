name: React (suíte)

# O PR NASCE RASCUNHO, E O CI LOCAL É QUEM O PROMOVE
#
# Nenhum job roda enquanto o PR está em rascunho. A iteração acontece na máquina
# de quem trabalha, com `scripts/gates/gates_runner.sh`, e o runner remoto só é
# chamado quando o trabalho está pronto para revisão — uma vez, em vez de uma por
# push. Medido antes da mudança: ~6 execuções de `Portões` por PR e 189 num dia
# de corrida autônoma, porque cada push redisparava tudo e o run anterior seguia
# até o fim medindo um commit que ninguém ia mergear.
#
# `ready_for_review` no `types` é o que fecha o ciclo, e é a metade que se
# esquece: sem ele, sair do rascunho não dispara evento nenhum, e o PR fica
# pronto e sem CI para sempre — trocar "roda demais" por "não roda nunca".
#
# `!= true` e não `== false`: em evento de `push` não existe `pull_request`, o
# campo vem nulo, e nulo não é rascunho.

on:
  workflow_call:
    inputs:
      runner:
        description: "Onde os jobs rodam: self-hosted (esta casa) ou ubuntu-latest (nuvem)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  # A guarda existe porque `apps/web` nasce declarado no workspace e vazio: o
  # esqueleto do monorepo cria o pacote antes de a fase da web escrever a
  # primeira linha. Sem ela, o fluxo reprova por medir o que ainda não existe,
  # e CI eternamente vermelho é CI que ninguém lê. Os jobs aparecem como
  # PULADOS, nunca como verdes — um portão que não mediu não aprova nada.
  guarda:
    name: Há código de web?
    runs-on: ${{ inputs.runner }}
    outputs:
      pronto: ${{ steps.olha.outputs.pronto }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: olha
        run: |
          source scripts/gates/medir.sh
          # exige_caminho reprova se apps/web sumir: aí não é "não há código", é
          # medição impossível, e portão que não mediu não aprova nada. Foi
          # exatamente este caso que passou despercebido quando um
          # working-directory herdado fazia a busca olhar para apps/web/apps/web.
          exige_caminho apps/web "o pacote da web"
          fontes=0
          if [ -d "$(medir_raiz)/apps/web/src" ]; then
            fontes="$(conta_sob apps/web/src -name '*.ts' -o -name '*.tsx')"
          fi
          echo "medido: $fontes fonte(s) sob apps/web/src"
          if [ "$fontes" -gt 0 ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web não tem código-fonte ainda (medido: 0). Os portões dele passam a valer na fase que o construir."
          fi

  qualidade:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Tipos, lint e testes
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # `dest` fora do HOME, e isto não é preferência: os runners desta casa são
      # quatro processos na MESMA máquina, com o MESMO `$HOME`. O padrão da ação é
      # `~/setup-pnpm`, então dois jobs simultâneos instalam e apagam o mesmo
      # diretório, e o segundo morre com `ENOTEMPTY: rmdir '/home/.../setup-pnpm'`
      # — ou pior, com `uv_cwd`, quando um apaga o diretório de trabalho do outro.
      # O sintoma é vermelho intermitente que não tem nada a ver com o diff, e que
      # some ao reexecutar sozinho. `runner.temp` é próprio de cada job.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Os pacotes deste fluxo estão no workspace
        run: |
          source scripts/gates/medir.sh
          exige_pacote_pnpm web "o pacote da web"

      - name: Tipos
        run: pnpm --filter web run typecheck

      - name: Lint
        run: pnpm --filter web run lint

      # A regra de caminho de import do ESLint alcança o que é declarativo; a
      # análise de dependência alcança o ciclo e a fronteira que ela não vê.
      - name: Direção de dependência
        run: |
          if [ -f apps/web/.dependency-cruiser.cjs ]; then
            pnpm --filter web exec depcruise src --validate
          else
            echo "::notice::apps/web não tem .dependency-cruiser.cjs — este passo não mediu nada. A análise passa a valer no item 025-a-direcao-de-dependencia-e-medida do roadmap; até lá, quem cobra a direção de import é o portão G5."
          fi

      - name: Testes
        run: pnpm --filter web exec vitest run --reporter=dot

      # O build embute a origem da API no artefato, e desde a fase que criou a
      # web ele recusa subir sem ela: um bundle com a origem ausente vira um
      # `throw` incondicional e entrega tela branca por trás de um portão verde.
      # O valor aqui é de verificação — o artefato do CI é descartado, e o de
      # publicação recebe a origem do ambiente que o publica.
      - name: Build
        env:
          VITE_API_URL: http://localhost:3000
        run: pnpm --filter web run build

      # A política do app é gravada no `index.html` pelo plugin do
      # `vite.config.ts`, e os quatro cabeçalhos constantes só existem em
      # resposta HTTP dos dois servidores do Vite. Nenhum dos dois é observável
      # lendo o código-fonte, e verificação que nunca roda de novo deixa de
      # valer no primeiro PR que mexer no artefato ou no plugin. A origem é a
      # mesma com que o passo acima construiu.
      - name: Política de conteúdo e cabeçalhos da web
        run: bash apps/web/scripts/verificar-politica.sh http://localhost:3000

      - name: As asserções da política da web mordem
        run: bash apps/web/scripts/__tests__/verificar-politica.test.sh

      - name: A regra do valor mágico morde
        run: bash apps/web/scripts/__tests__/valor-magico.test.sh

  comportamental:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Critérios comportamentais
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `dest` fora do HOME, e isto não é preferência: os runners desta casa são
      # quatro processos na MESMA máquina, com o MESMO `$HOME`. O padrão da ação é
      # `~/setup-pnpm`, então dois jobs simultâneos instalam e apagam o mesmo
      # diretório, e o segundo morre com `ENOTEMPTY: rmdir '/home/.../setup-pnpm'`
      # — ou pior, com `uv_cwd`, quando um apaga o diretório de trabalho do outro.
      # O sintoma é vermelho intermitente que não tem nada a ver com o diff, e que
      # some ao reexecutar sozinho. `runner.temp` é próprio de cada job.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Os pacotes deste fluxo estão no workspace
        run: |
          source scripts/gates/medir.sh
          exige_pacote_pnpm web "o pacote da web"

      - name: Navegador
        # `--with-deps` chama `sudo apt-get` para as bibliotecas de sistema do
        # navegador. No runner da nuvem isso funciona, porque o job roda como
        # root numa máquina descartável; no runner desta casa ele para com
        # "sudo: uma senha é necessária" — medido na primeira execução do
        # estágio local, em 04/09/2026.
        #
        # As bibliotecas são estáveis e foram instaladas uma vez nesta máquina
        # (`npx playwright install-deps chromium`). Reinstalá-las a cada job
        # seria pagar apt-get por execução para não mudar nada.
        #
        # Esta é a única diferença entre os dois estágios, e ela é declarada em
        # vez de resolvida com `|| true`: um passo que engole a falha faz o job
        # seguinte quebrar no lugar errado, dizendo que o navegador não abriu.
        run: |
          if [ "${{ inputs.runner }}" = "self-hosted" ]; then
            pnpm --filter web exec playwright install chromium
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi

      # Cada critério comportamental do plano vira um caso aqui. Isto não é
      # suíte de regressão: é a prova do que unidade e integração não provam.
      #
      # UMA SUBIDA, UMA ANÁLISE. O script roda a suíte inteira uma vez e guarda o
      # relatório JSON daquela execução, amarrado à árvore que o produziu. É dele
      # que cada critério comportamental é respondido — nenhum critério sobe a
      # aplicação de novo para medir o que esta execução já mediu.
      # A porta é declarada e diferente da que `verificar-politica.sh` usa no job
      # vizinho: os dois rodam em paralelo, na mesma máquina, e o padrão 4173
      # fazia o segundo a chegar morrer com `is already used`. Vermelho
      # intermitente, sem relação com o diff, que some ao reexecutar sozinho.
      - name: Playwright, numa subida só
        env:
          WEB_PREVIEW_PORT: "4273"
        run: bash scripts/e2e/relatorio.sh rodar

      # O relatório sobe SEMPRE, e não só na falha: ele é a evidência de que os
      # critérios comportamentais foram medidos, e é consultado quando o PR passa.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-resultado-${{ inputs.runner }}
          path: "apps/web/e2e-resultado.json"
          retention-days: 7

      # `moderate` e `minor` não reprovam caso nenhum, e o que não reprova e não
      # fica escrito desaparece. O registro é publicado sempre — inclusive
      # vazio, que é a diferença entre "nenhum apontamento" e "a análise não
      # rodou".
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-apontamentos
          path: "apps/web/e2e-apontamentos.json"
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: "apps/web/playwright-report/"
          retention-days: 7

  gates:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Gates arquiteturais
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # O portão da quarentena pergunta ao pnpm qual `minimumReleaseAge` está
      # valendo, e a imagem do runner traz npm e Yarn, nunca pnpm. Este job não
      # precisa do Node do `setup-node` nem do cache de dependência: precisa só
      # do binário que responde à pergunta. Trazer `pnpm/action-setup` para isso
      # acrescentaria código de terceiro rodando no runner por causa de uma
      # leitura — mais superfície de cadeia de suprimentos do que a pergunta
      # justifica, num item cuja tese é reduzi-la. O script peneira a forma do
      # `packageManager` antes de ele virar comando e instala sem scripts de
      # ciclo de vida: o valor vem do pull request que este job vai julgar.
      - name: pnpm, que o portão da quarentena interroga
        run: bash scripts/ci/instalar-pnpm.sh

      - name: Gates
        env:
          HARNESS_DIFF_BASE: origin/${{ github.base_ref || 'develop' }}...HEAD
        run: bash scripts/gates/gates_runner.sh --sem-artefatos
