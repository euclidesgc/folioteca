name: Portões (suíte)

# As asserções de medição são o portão dos portões. Se elas pararem de morder,
# todo portão que as usa passa a aprovar por não ter medido — que é o defeito
# que elas existem para matar. Por isso rodam em todo PR.
#
# O gatilho `push` existe pelo portão de segredo: `main` e `develop` recebem
# commit sem PR, e sem ele a árvore dessas duas só seria medida na próxima vez
# que alguém abrisse um pull request. O que ele **não** cobre é o histórico: o
# portão varre a árvore de trabalho, então um segredo commitado e removido no
# commit seguinte passa. Fechar essa janela é o item `040` do roadmap.
# O PR NASCE RASCUNHO, E O CI LOCAL É QUEM O PROMOVE
#
# Nenhum job roda enquanto o PR está em rascunho. A iteração acontece na máquina
# de quem trabalha, com `scripts/gates/gates_runner.sh`, e o runner remoto só é
# chamado quando o trabalho está pronto para revisão — uma vez, em vez de uma por
# push. Medido antes da mudança: ~6 execuções de `Portões` por PR e 189 num dia
# de corrida autônoma, porque cada push redisparava tudo.
#
# O run que o push seguinte torna obsoleto morre no instante desse push, e quem
# declara a concorrência é o fluxo chamador — `portoes.yml` —, nunca esta suíte:
# suíte chamada por `workflow_call` não produz run próprio, e chamador e chamado
# no mesmo grupo é a forma documentada de produzir impasse, com o job do pai
# esperando o filho que está enfileirado atrás do pai.
#
# `ready_for_review` no `types` é o que fecha o ciclo, e é a metade que se
# esquece: sem ele, sair do rascunho não dispara evento nenhum, e o PR fica
# pronto e sem CI para sempre — trocar "roda demais" por "não roda nunca".
#
# `!= true` e não `== false`: em evento de `push` não existe `pull_request`, o
# campo vem nulo, e nulo não é rascunho.

on:
  workflow_call:
    inputs:
      runner:
        description: "Onde os jobs rodam: self-hosted (esta casa) ou ubuntu-latest (nuvem)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  medir:
    name: As asserções de medição mordem
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `dest` fora do HOME, e isto não é preferência: os runners desta casa são
      # quatro processos na MESMA máquina, com o MESMO `$HOME`. O padrão da ação é
      # `~/setup-pnpm`, então dois jobs simultâneos instalam e apagam o mesmo
      # diretório, e o segundo morre com `ENOTEMPTY: rmdir '/home/.../setup-pnpm'`
      # — ou pior, com `uv_cwd`, quando um apaga o diretório de trabalho do outro.
      # O sintoma é vermelho intermitente que não tem nada a ver com o diff, e que
      # some ao reexecutar sozinho. `runner.temp` é próprio de cada job.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      # Os três testes abaixo não dependem de dependência instalada, e vêm antes
      # da instalação de propósito: são os mais baratos do repositório, e quando
      # uma asserção de medição quebra o resto do job não tem o que provar.
      - name: medir.sh reprova quando não consegue medir
        run: bash scripts/gates/__tests__/medir.test.sh
      - name: a fronteira de agent nomeia agents que existem
        run: bash scripts/gates/__tests__/fronteira-de-agent.test.sh
      - name: G8 morde o documento de divergência que mente
        run: bash scripts/gates/__tests__/status-de-divergencia.test.sh
      - name: o estado ancora na raiz do repositório, não no diretório corrente
        run: bash scripts/harness/__tests__/state.test.sh
      - name: o portão da quarentena separa o número certo do undefined
        run: bash scripts/gates/__tests__/quarentena.test.sh
      - name: o portão das ações reprova a tag móvel e o diretório sem fluxo
        run: bash scripts/gates/__tests__/acoes-em-sha.test.sh
      - name: o portão dos fluxos morde a guarda, o ready_for_review e a ordem dos estágios
        run: bash scripts/gates/__tests__/fluxos.test.sh
      - name: o portão do pnpm isolado separa o vazio do ilegível
        run: bash scripts/gates/__tests__/pnpm-isolado.test.sh
      - name: o portão da concorrência reprova o fluxo sem declaração e a suíte que declara
        run: bash scripts/gates/__tests__/concorrencia.test.sh
      - name: a peneira do packageManager recusa o que não é pnpm@X.Y.Z
        run: bash scripts/ci/__tests__/instalar-pnpm.test.sh
      - name: a tranca de merge trata verificação pendente como não medida
        run: bash scripts/gates/__tests__/merge-se-liberado.test.sh
      - name: o portão do atalho cobra teto, troca e item, e recusa o item que não existe
        run: bash scripts/gates/__tests__/atalho.test.sh

      # Os dois portões da cadeia de suprimentos são cobrados aqui, e não só
      # pelo `gates_runner.sh` dos três fluxos por frente: aqueles têm filtro de
      # `paths`, e um PR que mexa apenas em `.github/workflows/bloqueio.yml` não
      # dispara nenhum deles. Este fluxo roda em todo pull request, que é
      # exatamente a cobertura que uma referência de ação nova precisa ter.
      - name: A quarentena de sete dias está valendo
        run: bash scripts/gates/quarentena.sh
      - name: Toda ação do CI está fixada em SHA
        run: bash scripts/gates/acoes_em_sha.sh

      # Estes três medem o PRÓPRIO `.github/workflows`, e por isso pertencem a
      # este fluxo e não aos de cada frente: um PR que mexa só num workflow não
      # casa com nenhum filtro de `paths` deles, que é justamente o PR em que um
      # job sem guarda, uma instalação de pnpm no HOME compartilhado ou um fluxo
      # de gatilho sem `concurrency` entra.
      - name: Nada roda em rascunho, e a nuvem confirma o que a casa aprovou
        run: bash scripts/gates/fluxos.sh
      - name: Nenhuma instalação de pnpm escreve no HOME compartilhado
        run: bash scripts/gates/pnpm_isolado.sh
      - name: Todo fluxo de gatilho declara concurrency, e nenhuma suíte declara
        run: bash scripts/gates/concorrencia.sh

      # O marcador de atalho deliberado fecha o sentido código → fila no sentido
      # de volta: quem abre o arquivo meses depois lê ali que aquela função tem
      # teto, sem precisar do corpo do PR nem do roadmap.
      - name: Todo marcador de atalho declara teto, troca e item que existe na fila
        run: bash scripts/gates/atalho.sh

      # A partir daqui o job constrói: o portão de segredo varre os três
      # artefatos de build além das fontes rastreadas, e artefato que não existe
      # é medição impossível, não árvore limpa.
      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Build da API
        run: pnpm --filter api build

      - name: Build do hotsite
        run: pnpm --filter site build

      - name: Build do app
        run: pnpm --filter web run build
        env:
          VITE_API_URL: http://localhost:3000

      # O diretório é dedicado, e não `~/.local/bin`: o instalador prepende o
      # destino ao PATH de todos os passos seguintes, e `~/.local/bin` é
      # escrivível por qualquer coisa que tenha rodado antes — inclusive os três
      # builds acima, que carregam plugins do `node_modules` do próprio PR. Um
      # `git` plantado ali responderia pelo `git ls-files` do portão.
      - name: gitleaks na versão e no sha256 que o repositório fixou
        run: bash scripts/ci/instalar-gitleaks.sh
        env:
          GITLEAKS_BIN_DIR: ${{ runner.temp }}/gitleaks-bin

      - name: o portão de segredo reprova o que acha e o que não mediu
        run: bash scripts/gates/__tests__/segredo.test.sh

      - name: Nenhum segredo nas fontes nem nos três artefatos
        run: bash scripts/gates/segredo.sh

  divergencias:
    name: O D-nnn.md e o state.json dizem o mesmo status
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: G8 sobre todas as divergências
        run: |
          violacoes="$(bash scripts/gates/gate8_divergence_status.sh < /dev/null)"
          [ -z "$violacoes" ] || { printf '%s\n' "$violacoes"; exit 1; }
