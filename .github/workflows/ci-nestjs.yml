name: NestJS

on:
  push:
    branches: [main, develop]
    paths: ["apps/api/**", "scripts/gates/**", ".github/workflows/ci-nestjs.yml"]
  pull_request:
    paths: ["apps/api/**", "scripts/gates/**", ".github/workflows/ci-nestjs.yml"]

defaults:
  run:
    working-directory: apps/api

jobs:
  # `apps/api` pode nascer declarado no workspace e vazio: o esqueleto do
  # monorepo cria o pacote antes de a fase da API escrever a primeira linha.
  # Sem a guarda, o fluxo reprova por medir o que ainda não existe, e CI
  # eternamente vermelho é CI que ninguém lê. Os jobs aparecem como PULADOS,
  # nunca como verdes — um portão que não mediu não aprova nada.
  guarda:
    name: Há código de API?
    runs-on: ubuntu-latest
    outputs:
      pronto: ${{ steps.olha.outputs.pronto }}
    steps:
      - uses: actions/checkout@v4
      # O `working-directory` do topo vale para todo `run`, inclusive este. Sem
      # o `.`, a busca vira `apps/api/apps/api/src`, nunca acha nada, e a guarda
      # responde "não há código" para tudo — os portões saem verdes por não
      # terem medido, que é o defeito que ela existe para impedir.
      - id: olha
        working-directory: .
        run: |
          source scripts/gates/medir.sh
          exige_caminho "apps/api" "o pacote da API"
          fontes=0
          if [ -d "$(medir_raiz)/apps/api/src" ]; then
            fontes="$(conta_sob "apps/api/src" -name '*.ts')"
          fi
          echo "medido: $fontes fonte(s) sob apps/api/src"
          if [ "$fontes" -gt 0 ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api não tem código-fonte ainda (medido: 0). Os portões dele passam a valer na fase que o construir."
          fi

  qualidade:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      # O grafo do workspace se resolve na raiz; instalar dentro do app não o
      # enxerga.
      - name: Dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm exec tsc --noEmit

      - name: Testes de unidade
        run: pnpm test

  integracao:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Os testes de integração sobem o banco em contêiner: rodar contra um
      # dublê provaria menos do que o critério comportamental exige. E "nada a
      # medir ainda" é dito em voz alta, nunca deixado passar em silêncio.
      - name: Testes de integração
        run: |
          if [ -z "$(find test -name '*.e2e-spec.ts' -print -quit 2>/dev/null)" ]; then
            echo "::notice::Nenhum teste de integração em apps/api/test ainda — nada a medir."
            exit 0
          fi
          pnpm test:integration

      # Migration pendente é o defeito que só aparece no deploy. Aqui ele
      # aparece no PR — e a ausência do esquema é dita, não presumida.
      - name: Migrations aplicáveis
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "::notice::Sem prisma/schema.prisma em apps/api — nada a medir; o portão passa a valer no item que introduzir o esquema."
            exit 0
          fi
          pnpm exec prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --exit-code || {
            echo "::error::O esquema tem mudanças sem migration correspondente."
            exit 1
          }

  contrato:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      # O contrato commitado precisa ser o que o código gera. `git diff
      # --exit-code` sai 0 tanto quando gerou igual quanto quando o gerador não
      # escreveu nada; a prova de que ele rodou é o arquivo ter sido reescrito.
      - name: Contrato commitado é o gerado
        working-directory: .
        run: |
          source scripts/gates/medir.sh
          antes="$(date +%s)"
          sleep 1
          (cd "apps/api" && pnpm run openapi:generate)
          exige_escrita "apps/api/openapi.json" "$antes"
          git diff --exit-code -- "apps/api/openapi.json" || {
            echo "::error::O OpenAPI mudou. Rode 'pnpm run openapi:generate' e comite, junto com os clientes regenerados."
            exit 1
          }

  gates:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Gates arquiteturais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gates
        working-directory: .
        env:
          HARNESS_DIFF_BASE: origin/${{ github.base_ref || 'develop' }}...HEAD
        run: bash scripts/gates/gates_runner.sh
