name: NestJS

# DOIS ESTÁGIOS: A MÁQUINA PRIMEIRO, A NUVEM COMO CONFIRMAÇÃO
#
# A suíte inteira vive em `_suite-nestjs.yml` e é chamada duas vezes: primeiro no
# runner desta casa, que é rápido e não conta minuto; depois no da nuvem, e só se
# o primeiro passar.
#
# Por que os dois, e não só o de casa: o runner da nuvem nasce limpo a cada job,
# e é ele quem pega a classe de erro que a máquina de quem trabalha esconde —
# "passa aqui porque eu já tenho a ferramenta instalada". Um CI que roda só em
# casa deixa de medir exatamente isso.
#
# Por que nesta ordem, e não em paralelo: o de casa é o filtro barato. Ele reprova
# o que estiver errado sem gastar minuto nenhum, e a nuvem só é chamada para
# confirmar o que já passou.
#
# E nenhum dos dois roda em PR rascunho. A iteração acontece com
# `scripts/gates/gates_runner.sh` na máquina, o motor promove o PR quando os
# portões locais passam, e é a promoção que dispara isto — uma vez, em vez de uma
# por push. Medido antes: 189 execuções num dia de corrida, ~6 de `Portões` por
# PR. `ready_for_review` no `types` é a metade que se esquece: sem ele, sair do
# rascunho não dispara nada e o PR fica pronto e sem CI para sempre.
#
# `!= true` e não `== false`: em `push` não existe `pull_request`, o campo vem
# nulo, e nulo não é rascunho.

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "apps/web/src/shared/api/generated/**"
      - "scripts/gates/**"
      - ".github/workflows/ci-nestjs.yml"
      - ".github/workflows/_suite-nestjs.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "apps/api/**"
      - "apps/web/src/shared/api/generated/**"
      - "scripts/gates/**"
      - ".github/workflows/ci-nestjs.yml"
      - ".github/workflows/_suite-nestjs.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

# O teto de permissão fica escrito aqui, e não na configuração da organização:
# lá ele muda por um clique que não aparece em diff nenhum, e o dia em que
# virar "read and write" é o dia em que uma ação de terceiro comprometida
# escreve na branch com o token que o checkout deixou no disco.

permissions:
  contents: read

jobs:
  casa:
    name: Nesta máquina
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/_suite-nestjs.yml
    with:
      runner: self-hosted

  nuvem:
    name: Confirmação em máquina limpa
    needs: casa
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/_suite-nestjs.yml
    with:
      runner: ubuntu-latest
