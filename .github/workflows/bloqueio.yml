name: Bloqueio

# Um rótulo `blocked-on-*` deixa de ser bilhete e passa a ser tranca. Antes
# disto, o protocolo de divergência prometia "trava o merge" e o GitHub deixava
# mergear assim mesmo: rótulo sozinho não impede clique nenhum.
#
# `labeled` e `unlabeled` estão na lista de propósito — sem eles a verificação
# só reavaliaria no próximo push, e tirar o rótulo não destravaria nada.
# O PR NASCE RASCUNHO, E O CI LOCAL É QUEM O PROMOVE
#
# Nenhum job roda enquanto o PR está em rascunho. A iteração acontece na máquina
# de quem trabalha, com `scripts/gates/gates_runner.sh`, e o runner remoto só é
# chamado quando o trabalho está pronto para revisão — uma vez, em vez de uma por
# push. Medido antes da mudança: ~6 execuções de `Portões` por PR e 189 num dia
# de corrida autônoma, porque cada push redisparava tudo e o run anterior seguia
# até o fim medindo um commit que ninguém ia mergear.
#
# `ready_for_review` no `types` é o que fecha o ciclo, e é a metade que se
# esquece: sem ele, sair do rascunho não dispara evento nenhum, e o PR fica
# pronto e sem CI para sempre — trocar "roda demais" por "não roda nunca".
#
# `!= true` e não `== false`: em evento de `push` não existe `pull_request`, o
# campo vem nulo, e nulo não é rascunho.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

# Este roda SÓ nesta máquina, e de propósito: ele lê os rótulos do PR e roda as
# asserções do próprio script de bloqueio. Não compila, não instala e não depende
# de ambiente limpo — confirmá-lo na nuvem gastaria minuto para medir de novo o
# que não tem como divergir entre as duas.

jobs:
  bloqueio:
    name: Sem bloqueio pendente
    if: github.event.pull_request.draft != true
    runs-on: self-hosted
    steps:
      # A verificação passou a morar em `scripts/gates/`, testada, então o job
      # precisa da árvore. Enquanto ela era uma linha de shell no YAML, não
      # precisava — e era exatamente por caber numa linha que ninguém a testou.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A trava morde o rótulo indentado
        run: bash scripts/gates/__tests__/bloqueio.test.sh
      - name: Nenhum rótulo blocked-on-*
        env:
          ROTULOS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash scripts/gates/bloqueio.sh
