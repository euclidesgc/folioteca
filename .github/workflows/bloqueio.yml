name: Bloqueio

# Um rótulo `blocked-on-*` deixa de ser bilhete e passa a ser tranca. Antes
# disto, o protocolo de divergência prometia "trava o merge" e o GitHub deixava
# mergear assim mesmo: rótulo sozinho não impede clique nenhum.
#
# `labeled` e `unlabeled` estão na lista de propósito — sem eles a verificação
# só reavaliaria no próximo push, e tirar o rótulo não destravaria nada.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

jobs:
  bloqueio:
    name: Sem bloqueio pendente
    runs-on: ubuntu-latest
    steps:
      # A verificação passou a morar em `scripts/gates/`, testada, então o job
      # precisa da árvore. Enquanto ela era uma linha de shell no YAML, não
      # precisava — e era exatamente por caber numa linha que ninguém a testou.
      - uses: actions/checkout@v4
      - name: A trava morde o rótulo indentado
        run: bash scripts/gates/__tests__/bloqueio.test.sh
      - name: Nenhum rótulo blocked-on-*
        env:
          ROTULOS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash scripts/gates/bloqueio.sh
