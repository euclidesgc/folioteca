name: Portões

# As asserções de medição são o portão dos portões. Se elas pararem de morder,
# todo portão que as usa passa a aprovar por não ter medido — que é o defeito
# que elas existem para matar. Por isso rodam em todo PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  medir:
    name: As asserções de medição mordem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `exige_pacote_pnpm` conversa com o pnpm, então o teste dela precisa do
      # binário — sem ele a asserção reprova por não achar a ferramenta, e o
      # portão dos portões passa a acusar o ambiente em vez da asserção. Não há
      # `pnpm install`: `pnpm --filter <p> exec` resolve o pacote pelo
      # `pnpm-workspace.yaml`, e instalar dependência aqui só atrasaria o
      # portão mais barato do repositório.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: medir.sh reprova quando não consegue medir
        run: bash scripts/gates/__tests__/medir.test.sh
      - name: a fronteira de agent nomeia agents que existem
        run: bash scripts/gates/__tests__/fronteira-de-agent.test.sh
      - name: G8 morde o documento de divergência que mente
        run: bash scripts/gates/__tests__/status-de-divergencia.test.sh
      - name: o estado ancora na raiz do repositório, não no diretório corrente
        run: bash scripts/harness/__tests__/state.test.sh

  divergencias:
    name: O D-nnn.md e o state.json dizem o mesmo status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: G8 sobre todas as divergências
        run: |
          violacoes="$(bash scripts/gates/gate8_divergence_status.sh < /dev/null)"
          [ -z "$violacoes" ] || { printf '%s\n' "$violacoes"; exit 1; }
