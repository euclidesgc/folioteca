name: Portões

# As asserções de medição são o portão dos portões. Se elas pararem de morder,
# todo portão que as usa passa a aprovar por não ter medido — que é o defeito
# que elas existem para matar. Por isso rodam em todo PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  medir:
    name: As asserções de medição mordem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: medir.sh reprova quando não consegue medir
        run: bash scripts/gates/__tests__/medir.test.sh
      - name: a fronteira de agent nomeia agents que existem
        run: bash scripts/gates/__tests__/fronteira-de-agent.test.sh
      - name: o estado ancora na raiz do repositório, não no diretório corrente
        run: bash scripts/harness/__tests__/state.test.sh
