name: React

on:
  push:
    branches: [main, develop]
    paths: ["apps/web/**", ".github/workflows/ci-react.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/ci-react.yml"]

defaults:
  run:
    working-directory: apps/web

jobs:
  # A guarda existe porque `apps/web` nasce declarado no workspace e vazio: o
  # esqueleto do monorepo cria o pacote antes de a fase da web escrever a
  # primeira linha. Sem ela, o fluxo reprova por medir o que ainda não existe,
  # e CI eternamente vermelho é CI que ninguém lê. Os jobs aparecem como
  # PULADOS, nunca como verdes — um portão que não mediu não aprova nada.
  guarda:
    name: Há código de web?
    runs-on: ubuntu-latest
    outputs:
      pronto: ${{ steps.olha.outputs.pronto }}
    steps:
      - uses: actions/checkout@v4
      - id: olha
        run: |
          if [ -n "$(find apps/web/src -name '*.ts' -o -name '*.tsx' 2>/dev/null | head -1)" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web ainda não tem código-fonte. Os portões da web passam a valer na fase que a construir."
          fi

  qualidade:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # A regra de caminho de import do ESLint alcança o que é declarativo; a
      # análise de dependência alcança o ciclo e a fronteira que ela não vê.
      - name: Direção de dependência
        run: |
          if [ -f .dependency-cruiser.cjs ]; then
            pnpm exec depcruise src --validate
          fi

      - name: Testes
        run: pnpm test -- --reporter=dot

      - name: Build
        run: pnpm build

  comportamental:
    needs: guarda
    if: needs.guarda.outputs.pronto == 'true'
    name: Critérios comportamentais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Navegador
        run: pnpm exec playwright install --with-deps chromium

      # Cada critério comportamental do plano vira um caso aqui. Isto não é
      # suíte de regressão: é a prova do que unidade e integração não provam.
      - name: Playwright
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: "apps/web/playwright-report/"
          retention-days: 7
