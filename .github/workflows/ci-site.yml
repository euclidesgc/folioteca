name: Site

# O PR NASCE RASCUNHO, E O CI LOCAL É QUEM O PROMOVE
#
# Nenhum job roda enquanto o PR está em rascunho. A iteração acontece na máquina
# de quem trabalha, com `scripts/gates/gates_runner.sh`, e o runner remoto só é
# chamado quando o trabalho está pronto para revisão — uma vez, em vez de uma por
# push. Medido antes da mudança: ~6 execuções de `Portões` por PR e 189 num dia
# de corrida autônoma, porque cada push redisparava tudo e o run anterior seguia
# até o fim medindo um commit que ninguém ia mergear.
#
# `ready_for_review` no `types` é o que fecha o ciclo, e é a metade que se
# esquece: sem ele, sair do rascunho não dispara evento nenhum, e o PR fica
# pronto e sem CI para sempre — trocar "roda demais" por "não roda nunca".
#
# `!= true` e não `== false`: em evento de `push` não existe `pull_request`, o
# campo vem nulo, e nulo não é rascunho.

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/site/**"
      - "scripts/gates/**"
      - ".github/workflows/ci-site.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "apps/site/**"
      - "scripts/gates/**"
      - ".github/workflows/ci-site.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  verificacao:
    name: Tipos, build e portões
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: O pacote deste fluxo está no workspace
        run: |
          source scripts/gates/medir.sh
          exige_caminho apps/site/package.json "o manifesto do hotsite"
          exige_pacote_pnpm site "o pacote do hotsite"

      - name: Tipos
        run: pnpm --filter site typecheck

      - name: Build
        run: pnpm --filter site build

      # A política de conteúdo do hotsite só existe em resposta HTTP: nonce por
      # requisição e atributo estampado no HTML não são observáveis em arquivo
      # de configuração, e verificação que nunca roda de novo não reprova nada.
      - name: Política de conteúdo e cabeçalhos do hotsite
        run: bash apps/site/scripts/verificar-politica.sh producao

      - name: A comparação de nonces morde
        run: bash apps/site/scripts/__tests__/verificar-politica.test.sh

      # `--all` em vez do diff: o hotsite não tem pack, e o que o governa aqui
      # são G3 e G4 declarados sobre `apps/site/src/**`. Medir só o diff faria o
      # portão depender de uma base que um push em branch recém-criada não tem,
      # e base ausente é medição impossível, não árvore limpa.
      - name: Portões arquiteturais
        run: bash scripts/gates/gates_runner.sh --all --sem-artefatos
