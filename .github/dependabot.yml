# SHA sem rotina congela o repositório em versão com defeito conhecido, e as duas
# metades são inseparáveis: `scripts/gates/acoes_em_sha.sh` proíbe a tag móvel, e
# este arquivo é quem propõe a subida do pino. O robô lê o `# vX.Y.Z` ao lado do
# SHA para saber de onde está saindo, e atualiza os dois juntos.
#
# O ecossistema dos pacotes de JavaScript fica de fora, e uma única entrada é o
# arquivo inteiro. A conta que falta a quem julga um PR de dependência — se a
# versão de saída tem vulnerabilidade conhecida — é de
# `scripts/gates/vulnerabilidade.sh`, que audita o lockfile inteiro em todo pull
# request. Quem falta é a rotina que abre o PR de subida, e ela é o item
# `041-a-rotina-alcanca-os-pacotes-de-javascript`. Ligá-la antes da conta
# produziria PR semanal que ninguém sabe aprovar ou recusar por critério escrito —
# e PR de robô que fica parado ensina a ignorar PR de robô.
#
# O destino é `develop`, e não `main`: `main` só recebe o que passou pela pilha.
#
# O `cooldown` de sete dias é a mesma espera que o workspace da raiz impõe à
# resolução de pacote, e existe pelo mesmo motivo: sem ele, uma ação comprometida
# que publique tag nova chega como PR de subida no mesmo dia, o portão aprova a
# forma do SHA novo, e a janela em que a campanha seria detectada e despublicada
# nunca é usada. Metade da tese valendo só para um dos dois ecossistemas é a
# metade que não vale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    cooldown:
      default-days: 7
