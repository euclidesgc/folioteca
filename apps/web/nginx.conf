# A SPA é servida como estático, e toda rota que não é arquivo cai no index.
#
# `try_files ... /index.html` é o que faz o roteamento do cliente funcionar em
# recarga: sem ele, abrir /documentos/42 direto no navegador devolve 404 do
# nginx, porque esse caminho não existe no disco.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O artefato carrega a política de conteúdo numa `<meta http-equiv>` gravada
    # pelo build. Os quatro cabeçalhos constantes ficam aqui porque `<meta>` não
    # os aceita — e `apps/web/scripts/verificar-politica.sh` reprova o `dist/`
    # que tente declará-los, justamente para o artefato não decidir por quem
    # serve.
    #
    # `X-Frame-Options` carrega sozinho a proteção contra enquadramento: a
    # política do artefato não declara `frame-ancestors`, porque entregue por
    # `<meta>` o navegador a ignora. Tirar a linha abaixo não deixa nada no
    # lugar dela, e o portão a mede aqui por isso.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O hash no nome do arquivo é o que torna o cache longo seguro: o build
    # troca o nome quando o conteúdo muda.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
