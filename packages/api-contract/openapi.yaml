openapi: 3.1.0
info:
  title: Folioteca API
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado da API e do banco de dados
      responses:
        "200":
          description: A API e o banco de dados estão disponíveis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: O banco de dados está indisponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /installation:
    get:
      operationId: getInstallation
      summary: Estado da instalação da instância
      responses:
        "200":
          description: O estado da instalação foi consultado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationStatusResponse"
    post:
      operationId: createInstallation
      summary: Instala a instância e abre a sessão da pessoa administradora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstallationBody"
      responses:
        "201":
          description: A instância foi instalada e a sessão foi aberta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "403":
          description: A instalação foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A instância já foi instalada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Pessoa da sessão atual e a organização dela
      responses:
        "200":
          description: A sessão é válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me/preferences:
    patch:
      operationId: updateCurrentUserPreferences
      summary: Grava as preferências da pessoa da sessão atual
      description: >-
        Grava a largura da página escolhida pela pessoa, que vale para todos os
        documentos dela, e devolve a pessoa da sessão atual já atualizada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: As preferências foram gravadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          description: A largura da página está ausente ou é inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Escolha uma largura de página válida.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      summary: Abre a sessão da pessoa com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: A sessão foi aberta.
          headers:
            Set-Cookie:
              description: Cookie de sessão `folioteca_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: O e-mail ou a senha estão incorretos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual
      responses:
        "204":
          description: A sessão foi encerrada.
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents:
    post:
      operationId: createDocument
      summary: Cria um documento com o nome padrão no espaço pessoal de quem chama, no espaço de unidade informado ou no espaço livre de que a pessoa é dona ou membro
      description: >-
        O documento nasce com o nome "documento-sem-titulo-N", em que N é o
        menor inteiro a partir de 1 ainda não usado nesse padrão entre os
        documentos do dono, inclusive os que estão na lixeira. Duas criações
        simultâneas do mesmo dono recebem números diferentes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentInput"
      responses:
        "201":
          description: O documento foi criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            O espaço informado não existe, tem id malformado, não é de unidade
            ou quem chama não alcança o espaço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getDocuments
      summary: Lista os documentos do escopo informado
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [mine, favorites, trash]
      responses:
        "200":
          description: Os documentos do escopo foram listados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{documentId}:
    get:
      operationId: getDocument
      summary: Documento e o nível de acesso de quem chama
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O documento foi encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateDocument
      summary: Renomeia o documento
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBody"
      responses:
        "200":
          description: O documento foi renomeado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: O documento está na lixeira e não pode ser editado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDocument
      summary: Apaga definitivamente o documento que está na lixeira
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: O documento foi apagado definitivamente.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            A requisição foi recusada, ou quem chama tem acesso ao documento
            mas não é o proprietário (só ele exclui).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: O documento não está na lixeira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{documentId}/trash:
    post:
      operationId: trashDocument
      summary: Move o documento para a lixeira
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O documento está na lixeira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            A requisição foi recusada, ou quem chama tem acesso ao documento
            mas não é o proprietário (só ele move para a lixeira).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{documentId}/restore:
    post:
      operationId: restoreDocument
      summary: Restaura o documento que está na lixeira
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O documento saiu da lixeira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            A requisição foi recusada, ou quem chama tem acesso ao documento
            mas não é o proprietário (só ele restaura).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{documentId}/favorite:
    put:
      operationId: addFavorite
      summary: Marca o documento como favorito de quem chama
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: O documento ficou marcado como favorito.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeFavorite
      summary: Desmarca o documento como favorito de quem chama
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: O documento deixou de estar marcado como favorito.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{documentId}/shares:
    get:
      operationId: listDocumentShares
      tags:
        - documents
      summary: Lista quem tem acesso ao documento
      description: >-
        Lista quem tem acesso ao documento. Só o proprietário consulta. O
        proprietário vem primeiro, depois as pessoas com acesso direto em ordem
        alfabética. Documento na lixeira continua legível para o proprietário.
        As checagens acontecem nesta ordem: 401, 404 (documento inexistente ou
        sem acesso), 403 (quem chama não é o proprietário).
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: O proprietário e as pessoas com acesso ao documento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAccessListResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Só o proprietário pode ver quem tem acesso a este documento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /documents/{documentId}/shares/{personId}:
    put:
      operationId: shareDocument
      tags:
        - documents
      summary: Compartilha o documento com uma pessoa da instância
      description: >-
        Dá a uma pessoa da instância acesso de leitura ou de edição ao documento. Só o
        proprietário compartilha. Repetir a chamada para a mesma pessoa devolve
        o mesmo 200, sem criar um segundo compartilhamento. As checagens
        acontecem nesta ordem: 401, 404 (documento inexistente ou sem acesso),
        403 (quem chama não é o proprietário), 409 (documento na lixeira), 400
        (corpo inválido, compartilhar consigo mesmo ou pessoa fora da
        instância).
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: personId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareDocumentInput"
      responses:
        "200":
          description: Compartilhamento criado ou nível de acesso atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentShareResponse"
        "400":
          description: >-
            O corpo é inválido, a pessoa é o próprio proprietário ou a pessoa
            não existe nesta instância.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Só o proprietário pode compartilhar este documento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: O documento está na lixeira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeDocumentShare
      tags:
        - documents
      summary: Remove o acesso de uma pessoa ao documento
      description: >-
        Remove o compartilhamento direto do documento com uma pessoa. Só o
        proprietário remove. A operação é idempotente: responde 204 também
        quando a pessoa já não tinha compartilhamento. As checagens acontecem
        nesta ordem: 401, 404 (documento inexistente ou sem acesso), 403 (quem
        chama não é o proprietário), 409 (documento na lixeira).
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: >-
            Acesso removido; também responde 204 se a pessoa já não tinha
            compartilhamento.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Só o proprietário pode remover o acesso a este documento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: O documento não existe ou não está acessível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Este documento está na lixeira. Restaure-o para editar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /org-units:
    get:
      operationId: getOrgUnits
      tags:
        - org-units
      summary: Lista plana das unidades da organização
      description: >-
        Lista plana de todas as unidades da organização, ordenada por nome, só
        para a administração.
      responses:
        "200":
          description: As unidades da organização foram listadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitsResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createOrgUnit
      tags:
        - org-units
      summary: Cria uma unidade filha
      description: >-
        Grava a unidade e o espaço dela na mesma operação, só para a
        administração. O nome é aparado e é único entre as unidades irmãs sem
        diferenciar maiúsculas de minúsculas. As checagens acontecem nesta
        ordem: 401, 403, 404/400 e por fim 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgUnitInput"
      responses:
        "201":
          description: A unidade e o espaço dela foram criados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada: a unidade mãe não existe na organização ou
            o `parentId` está malformado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Já existe uma unidade com esse nome neste nível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /org-units/{orgUnitId}:
    patch:
      operationId: updateOrgUnit
      tags:
        - org-units
      summary: Renomeia a unidade
      description: >-
        Troca só o nome da unidade, só para a administração; a unidade mãe é
        imutável. O nome é aparado e é único entre as unidades irmãs sem
        diferenciar maiúsculas de minúsculas. Renomear a raiz renomeia também
        a organização. As checagens acontecem nesta ordem: 401, 403, 404/400 e
        por fim 409.
      parameters:
        - name: orgUnitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUnitInput"
      responses:
        "200":
          description: A unidade foi renomeada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada: o id da rota não existe na organização ou
            está malformado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Já existe uma unidade com esse nome neste nível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOrgUnit
      tags:
        - org-units
      summary: Apaga a unidade e o espaço dela
      description: >-
        Apaga definitivamente a unidade e o espaço `UNIT` dela na mesma
        operação, só para a administração. As checagens acontecem nesta ordem:
        CSRF (guarda global), 401, 403, 404 (o id da rota não existe na
        organização ou está malformado) e por fim 409 — raiz, depois unidades
        filhas, depois documentos do espaço, nessa ordem.
      parameters:
        - name: orgUnitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: A unidade e o espaço dela foram apagados.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada: o id da rota não existe na organização ou
            está malformado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            A unidade não pode ser apagada: é a raiz, tem unidades filhas ou o
            espaço dela ainda tem documentos, inclusive na lixeira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /org-units/{orgUnitId}/space:
    patch:
      operationId: updateOrgUnitSpace
      tags:
        - org-units
      summary: Muda quem vê o espaço da unidade
      description: >-
        Muda quem vê o espaço da unidade, só para a administração: `own` deixa
        o espaço visível só para quem está lotado na unidade; `inherit` faz
        quem vê o espaço da unidade-pai ver também este. `inherit` é recusado
        na raiz com 409, porque ela não tem unidade-pai. Marcar o modo atual
        devolve 200. As checagens acontecem nesta ordem: 401, 403, 404/400 e
        por fim 409.
      parameters:
        - name: orgUnitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUnitSpaceInput"
      responses:
        "200":
          description: O modo de acesso ao espaço da unidade foi gravado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada: o id da rota não existe na organização ou
            está malformado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A unidade raiz não tem unidade-pai.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /org-units/{orgUnitId}/people:
    get:
      operationId: getOrgUnitPeople
      tags:
        - org-units
      summary: Lista as pessoas lotadas na unidade
      description: >-
        Lista as pessoas lotadas na unidade, só para a administração, ordenada
        por nome com o colador pt-BR. A unidade vem no mesmo envelope
        (`orgUnit`) para a página ter o nome dela numa requisição só, sem
        depender da árvore inteira e sem uma segunda origem de "não
        encontrada". Unidade inexistente, de outra organização e com id
        malformado respondem exatamente o mesmo 404.
      parameters:
        - name: orgUnitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: As pessoas lotadas na unidade foram listadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedPeopleResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada: o id da rota não existe na organização ou
            está malformado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: assignPersonToOrgUnit
      tags:
        - org-units
      summary: Lota uma pessoa na unidade
      description: >-
        Lota a pessoa na unidade, só para a administração. A raiz aceita
        lotação como qualquer outra unidade. Lotação repetida responde 409
        ("Esta pessoa já está lotada nesta unidade."), vindo do índice do
        banco e sem consulta prévia, para que dois envios simultâneos gerem
        uma linha só. Unidade inexistente, de outra organização e com id
        malformado respondem exatamente o mesmo 404; pessoa inexistente, de
        outra organização e com id malformado respondem "Pessoa não
        encontrada.". As checagens acontecem nesta ordem: CSRF (guarda
        global), 401, 403, 404 da unidade, 400 do corpo, 404 da pessoa e por
        fim 409.
      parameters:
        - name: orgUnitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPersonRequest"
      responses:
        "201":
          description: A pessoa foi lotada na unidade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedPersonResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada (o id da rota não existe na organização ou
            está malformado) ou pessoa não encontrada (o `personId` não existe
            na organização ou está malformado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Esta pessoa já está lotada nesta unidade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /org-units/{orgUnitId}/people/{personId}:
    delete:
      operationId: removePersonFromOrgUnit
      tags:
        - org-units
      summary: Tira a lotação da pessoa na unidade
      description: >-
        Tira a lotação da pessoa na unidade, só para a administração. Apaga
        **apenas** a linha de lotação: `Person`, `OrgUnit` e `Space` não são
        tocados, a pessoa continua na instância e continua lotada nas outras
        unidades em que estiver. Unidade inexistente, de outra organização ou
        com id malformado respondem "Unidade não encontrada."; pessoa
        inexistente, de outra organização, com id malformado ou que já não está
        lotada nesta unidade respondem "Pessoa não encontrada." — um 404 único,
        para a rota não contar quem existe na instância. As checagens acontecem
        nesta ordem: CSRF (guarda global), 401, 403, 404 da unidade e 404 da
        pessoa.
      parameters:
        - name: orgUnitId
          in: path
          required: true
          schema:
            type: string
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: A lotação foi apagada.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Unidade não encontrada (o id da rota não existe na organização ou
            está malformado) ou pessoa não encontrada (o `personId` não existe
            na organização, está malformado ou já não está lotado nesta
            unidade).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /people:
    get:
      operationId: searchPeople
      tags:
        - people
      summary: Busca pessoas da organização por nome ou e-mail
      description: >-
        Busca pessoas da organização de quem chama, por parte do nome ou do
        e-mail, sem diferenciar maiúsculas de minúsculas, só para a
        administração. O limite é duro, de 10 resultados, e não há parâmetro
        de limite na rota: `hasMore` avisa que há mais do que o mostrado. `q`
        ausente, vazio ou só com espaços devolve lista vazia, sem tocar o
        banco e sem erro — o campo de busca nasce vazio e volta a ficar vazio.
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: As pessoas encontradas foram listadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /people/search:
    get:
      operationId: searchPeopleToShare
      tags:
        - people
      summary: Busca pessoas da instância para compartilhar um documento
      description: >-
        Busca pessoas da organização de quem chama, por parte do nome ou do
        e-mail, sem diferenciar maiúsculas de minúsculas. Qualquer pessoa com
        sessão pode buscar. `q` com menos de 2 caracteres (depois de tirar os
        espaços das pontas) devolve lista vazia, sem tocar o banco. Devolve no
        máximo 10 pessoas, com `hasMore` avisando que há mais, e nunca inclui
        quem pede.
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: As pessoas encontradas foram listadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admins:
    get:
      operationId: getAdmins
      tags:
        - admins
      summary: Lista quem administra a organização de quem chama
      description: >-
        Lista todas as pessoas com `isAdmin` da organização de quem chama, só
        para a administração, sem paginação e sem limite. A ordem é
        alfabética por nome com colador pt-BR, e nenhuma pessoa de outra
        organização aparece. `GET` não passa pelo `CsrfGuard`, que só cobre
        método de escrita: a ordem de falha é 401 e depois 403.
      responses:
        "200":
          description: Os administradores foram listados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminsResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admins/{personId}:
    put:
      operationId: promoteAdmin
      tags:
        - admins
      summary: Promove uma pessoa a administração da instância
      description: >-
        Promove a pessoa a administração da instância, só para a
        administração. A pessoa é sempre procurada **dentro da organização de
        quem chama**, nunca por id solto. Promover quem já administra responde
        200, sem erro: promover é idempotente e nada distingue "já era" de
        "acabou de ser". Pessoa inexistente, de outra organização ou com id
        malformado respondem o **mesmo** 404, para a rota não contar quem
        existe na instância. A requisição não tem corpo, e as checagens
        acontecem nesta ordem: CSRF (guarda global), 401, 403 e 404.
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A pessoa passou a administrar a instância.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Pessoa não encontrada (o `personId` não existe na organização de
            quem chama ou está malformado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: demoteAdmin
      tags:
        - admins
      summary: Tira o papel de administração de uma pessoa
      description: >-
        Tira o papel de administração da pessoa, só para a administração. A
        pessoa é sempre procurada **dentro da organização de quem chama**,
        nunca por id solto. Rebaixar quem já é membro responde 200, sem erro e
        sem escrita: tirar o papel é idempotente. A instância **nunca** fica
        sem nenhuma administração — tirar o papel da última administração é
        recusado com 409, e a pessoa continua administrando. Pessoa
        inexistente, de outra organização ou com id malformado respondem o
        **mesmo** 404, para a rota não contar quem existe na instância. A
        requisição não tem corpo, e as checagens acontecem nesta ordem: CSRF
        (guarda global), 401, 403, 404 e por fim 409.
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A pessoa deixou de administrar a instância.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Pessoa não encontrada (o `personId` não existe na organização de
            quem chama ou está malformado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            É a única administração da instância: o papel não pode ser
            retirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /spaces:
    get:
      operationId: listSpaces
      tags:
        - spaces
      summary: Lista os espaços de unidade e os espaços livres de quem chama
      description: >-
        Lista os espaços de unidade em que a pessoa da sessão está lotada
        diretamente: lotação numa unidade filha não traz a unidade pai, e não
        há herança em nenhum sentido. Ser administração não inclui nada a
        mais. A lista traz também os espaços livres de que a pessoa da sessão
        é dona, na organização dela, misturados aos de unidade na mesma ordem.
        A ordem é alfabética pelo nome com colador pt-BR, com desempate pelo
        id do espaço. A lista é relida a cada pedido, então uma lotação
        removida some já no pedido seguinte.
      responses:
        "200":
          description: Os espaços de unidade e os espaços livres foram listados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacesResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSpace
      tags:
        - spaces
      summary: Cria um espaço livre
      description: >-
        Cria um espaço livre na organização da pessoa da sessão, que passa a
        ser a dona dele. A organização e a dona vêm só da sessão, nunca do
        corpo. O nome é aparado antes de medir e é único por dono entre os
        espaços livres, sem diferenciar maiúsculas de minúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceInput"
      responses:
        "201":
          description: O espaço livre foi criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Você já tem um espaço livre com esse nome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /spaces/{spaceId}:
    get:
      operationId: getSpace
      tags:
        - spaces
      summary: Lê um espaço
      description: >-
        Lê o espaço informado com a forma de alcance de quem chama. O espaço
        livre só é lido pelo dono (reach owner). O espaço de unidade é lido por
        quem a alcança diretamente (reach direct) ou por herança (reach
        inherited). Qualquer outro caso (espaço inexistente, id malformado,
        espaço pessoal, espaço livre de outra pessoa, sem alcance ou
        administração não lotada) recebe o mesmo 404 "Espaço não encontrado.".
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O espaço foi lido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceDetailResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            O espaço não existe, tem id malformado, é pessoal, é livre de outra
            pessoa ou quem chama não o alcança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSpaceSettings
      tags:
        - spaces
      summary: Muda quem adiciona pessoas a um espaço livre
      description: >-
        Só o dono do espaço livre muda quem adiciona pessoas: só ele ou
        qualquer membro. A operação é idempotente. Um membro que não é o dono
        recebe 403; espaço inexistente, com id malformado, de unidade ou que
        quem chama não alcança recebe o mesmo 404 "Espaço não encontrado.";
        corpo inválido recebe 400.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceInput"
      responses:
        "200":
          description: A configuração do espaço livre foi salva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceDetailResponse"
        "400":
          description: >-
            "Dados inválidos." com "Escolha quem adiciona pessoas." para valor
            ausente ou não booleano, ou "Campo não permitido." para campo extra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            "Só o dono do espaço pode mudar quem adiciona pessoas." para quem é
            membro do espaço sem ser o dono.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            "Espaço não encontrado." para espaço inexistente, com id
            malformado, de unidade ou que quem chama não alcança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /spaces/{spaceId}/members:
    get:
      operationId: listSpaceMembers
      tags:
        - spaces
      summary: Lista as pessoas de um espaço
      description: >-
        No espaço de unidade, lista as pessoas lotadas diretamente na unidade,
        com quem chama primeiro e depois por nome e e-mail; quem alcança o
        espaço, diretamente ou por herança, vê a lista. No espaço livre, o dono
        e os membros veem a lista: o dono primeiro, depois quem chama se for
        membro, depois os demais por nome e e-mail. Não há 403. Espaço sem
        alcance, inexistente, com id malformado ou livre que quem chama não
        alcança recebe o mesmo 404 opaco.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: As pessoas do espaço foram listadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMembersResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            O espaço não existe, tem id malformado, é livre e quem chama não é
            dono nem membro, ou quem chama não o alcança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /spaces/{spaceId}/members/{personId}:
    put:
      operationId: addSpaceMember
      tags:
        - spaces
      summary: Adiciona uma pessoa a um espaço livre
      description: >-
        Adiciona a pessoa informada, da mesma instância, como membro do espaço
        livre. O dono sempre adiciona; um membro adiciona quando o espaço está
        aberto (membersCanInvite). A operação é idempotente: repetir para a
        mesma pessoa devolve o mesmo 200 sem duplicar. Adicionar o próprio
        dono, um membro adicionando a si mesmo ou o dono, ou uma pessoa que
        não existe nesta instância recebe 400; um membro com o espaço fechado
        recebe 403; espaço inexistente, com id malformado, de unidade ou que
        quem chama não alcança recebe o mesmo 404 opaco.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A pessoa é membro do espaço livre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberResponse"
        "400":
          description: >-
            "Você já é o dono deste espaço." quando o dono adiciona a si mesmo,
            "Você já é membro deste espaço." quando um membro adiciona a si
            mesmo, "Esta pessoa é a dona deste espaço." quando um membro
            adiciona o dono, ou "Pessoa não encontrada nesta instância." para
            pessoa inexistente, com id malformado ou de outra instância.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            "Só o dono do espaço pode adicionar pessoas." para quem é membro
            do espaço sem ser o dono, com o espaço fechado (membersCanInvite
            false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            "Espaço não encontrado." para espaço inexistente, com id
            malformado, de unidade ou que quem chama não alcança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeSpaceMember
      tags:
        - spaces
      summary: Remove uma pessoa de um espaço livre
      description: >-
        Remove a pessoa informada dos membros do espaço livre. Só o dono do
        espaço livre remove. A operação é idempotente: remover uma pessoa que
        não é membro também devolve 204. Remover o próprio dono recebe 400 "O
        dono não pode ser removido."; um membro que tenta remover recebe 403
        "Só o dono do espaço pode remover pessoas."; espaço inexistente, com
        id malformado, de unidade ou que quem chama não alcança recebe o mesmo
        404 "Espaço não encontrado.".
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: A pessoa não é membro do espaço livre.
        "400":
          description: >-
            "O dono não pode ser removido." ao remover o dono do espaço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            "Só o dono do espaço pode remover pessoas." para quem é membro
            do espaço sem ser o dono.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            "Espaço não encontrado." para espaço inexistente, com id
            malformado, de unidade ou que quem chama não alcança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSpaceMemberLevel
      tags:
        - spaces
      summary: Muda o nível de um membro de um espaço livre
      description: >-
        Só o dono do espaço livre muda o nível de um membro: "edit" cria e
        edita documentos, "view" só lê. A operação é idempotente. Um membro
        que tenta mudar recebe 403; o dono como alvo, corpo ausente, nível
        inválido ou campo a mais recebem 400; espaço inexistente, com id
        malformado, de unidade ou que quem chama não alcança, e pessoa que não
        é membro, recebem 404.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - name: personId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceMemberInput"
      responses:
        "200":
          description: O membro está com o nível informado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMemberLevelResponse"
        "400":
          description: >-
            "O dono do espaço não tem nível." quando o alvo é o dono, ou
            "Dados inválidos." para corpo ausente, nível inválido ou campo a
            mais.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            "Só o dono do espaço pode mudar o nível de um membro." para quem é
            membro do espaço sem ser o dono.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            "Espaço não encontrado." para espaço inexistente, com id
            malformado, de unidade ou que quem chama não alcança, ou "Esta
            pessoa não é membro deste espaço." para pessoa que não é membro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /spaces/{spaceId}/documents:
    get:
      operationId: listSpaceDocuments
      tags:
        - spaces
      summary: Lista os documentos de um espaço de unidade ou de um espaço livre
      description: >-
        Lista os documentos fora da lixeira do espaço de unidade ou do espaço
        livre informado, dos mais recentes para os mais antigos. No espaço de
        unidade, a lista é de quem alcança o espaço de unidade (lotação direta
        ou herança); no espaço livre, o dono ou membro do espaço recebe 200.
        Espaço sem alcance, inexistente, com id malformado ou pessoal recebe o
        mesmo 404 opaco.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Os documentos do espaço foram listados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            O espaço não existe, tem id malformado, não é de unidade ou quem
            chama não o alcança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations:
    post:
      operationId: createInvitation
      tags:
        - invitations
      summary: Cria um convite para entrar na organização
      description: >-
        Cria um convite para o e-mail informado, só para a administração. O
        e-mail é aparado e passado para minúsculas; um convite pendente por
        e-mail, sem diferenciar maiúsculas de minúsculas — convidar o mesmo
        e-mail de novo substitui o convite anterior, e o link antigo deixa de
        valer. O token vem em claro só nesta resposta; o servidor guarda
        apenas o hash dele. As checagens acontecem nesta ordem: CSRF (guarda
        global), 401, 403, 400 (corpo) e por fim 409 (o e-mail já é de uma
        pessoa da organização).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationInput"
      responses:
        "201":
          description: O convite foi criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitationResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: O e-mail já é de uma pessoa da organização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listInvitations
      tags:
        - invitations
      summary: Lista os convites pendentes da organização
      description: >-
        Só a administração. Devolve apenas os convites pendentes — nem
        aceitos, nem vencidos — do mais recente para o mais antigo. O token
        nunca sai aqui: o servidor guarda apenas o hash dele.
      responses:
        "200":
          description: Os convites pendentes da organização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationsResponse"
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/{invitationId}/revoke:
    post:
      operationId: revokeInvitation
      tags:
        - invitations
      summary: Revoga um convite pendente
      description: >-
        Só a administração. Marca o convite como revogado **sem apagar a
        linha**, que continua na base como auditoria do que foi convidado e
        cortado. O link enviado para de funcionar na hora: abrir ou aceitar
        aquele convite passa a responder o mesmo 404 de um link inexistente.
        Convite inexistente, de outra organização, já aceito, vencido ou já
        revogado respondem o **mesmo** 404, com o mesmo corpo: nada aqui
        diferencia os casos, para a rota não virar um oráculo sobre quais
        convites existem ou quem já aceitou. As checagens acontecem nesta
        ordem: CSRF (guarda global), 401, 403 e por fim 404.
      parameters:
        - name: invitationId
          in: path
          required: true
          description: Identificador do convite, o mesmo que a lista devolve.
          schema:
            type: string
      responses:
        "204":
          description: O convite foi revogado. A resposta não tem corpo.
        "401":
          description: Não há sessão válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            O convite não está disponível. A mesma resposta para convite
            inexistente, de outra organização, já aceito, vencido ou já
            revogado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags:
        - invitations
      summary: Dados do convite para a tela de criar conta
      description: >-
        Rota pública: quem abre o link do convite ainda não tem conta, e o
        servidor ignora qualquer sessão em curso. Devolve só o que quem recebeu
        o link já sabe — o e-mail convidado e o nome da organização. Nenhum
        identificador, nenhuma data e nenhum dado de quem convidou saem daqui.
      parameters:
        - name: token
          in: path
          required: true
          description: >-
            Token do convite em claro, o mesmo do link recebido; o servidor
            guarda apenas o hash dele e nunca o registra.
          schema:
            type: string
      responses:
        "200":
          description: O convite está pendente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewResponse"
        "404":
          description: >-
            O convite não está disponível. A mesma resposta para link
            inexistente, expirado, já aceito ou revogado: nada no corpo, no
            código ou no tempo de resposta distingue os casos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags:
        - invitations
      summary: Aceita o convite, cria a pessoa e abre a sessão dela
      description: >-
        Rota pública: aceitar o convite é o que cria a conta, e o servidor
        ignora qualquer sessão em curso. O e-mail não vem no corpo — é o do
        convite. A pessoa nasce sem administração e com o espaço pessoal dela.
        As checagens acontecem nesta ordem: CSRF (guarda global), 400 (corpo),
        404 (convite) e por fim 409 (o e-mail já é de uma pessoa). Não existe
        410 para convite expirado ou já aceito: distinguir esses casos do 404
        seria o oráculo que o convite não pode dar.
      parameters:
        - name: token
          in: path
          required: true
          description: >-
            Token do convite em claro, o mesmo do link recebido; o servidor
            guarda apenas o hash dele e nunca o registra.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "201":
          description: >-
            A conta foi criada e a sessão foi aberta. A resposta traz o
            `Set-Cookie` da sessão, e o corpo é o mesmo de `GET /auth/me`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          description: Os dados informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "403":
          description: A requisição foi recusada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            O convite não está disponível. A mesma resposta para link
            inexistente, expirado, já aceito ou revogado: nada no corpo, no
            código ou no tempo de resposta distingue os casos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: O e-mail do convite já é de uma pessoa da organização.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up]
        commit:
          type: string
      required:
        - status
        - database
        - commit
    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Health"
      required:
        - data
    InstallationStatus:
      type: object
      properties:
        installed:
          type: boolean
      required:
        - installed
    InstallationStatusResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InstallationStatus"
      required:
        - data
    CreateInstallationBody:
      type: object
      properties:
        code:
          type: string
        organizationName:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - code
        - organizationName
        - name
        - email
        - password
    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    CurrentUser:
      type: object
      properties:
        person:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            isAdmin:
              type: boolean
            documentPageWidth:
              $ref: "#/components/schemas/DocumentPageWidth"
          required:
            - id
            - name
            - email
            - isAdmin
            - documentPageWidth
        organization:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
      required:
        - person
        - organization
    DocumentPageWidth:
      type: string
      description: >-
        Largura da folha do documento escolhida pela pessoa: Pequena, Média,
        Grande ou Completa.
      enum: [small, medium, large, full]
    UpdatePreferencesBody:
      type: object
      properties:
        documentPageWidth:
          $ref: "#/components/schemas/DocumentPageWidth"
      required:
        - documentPageWidth
    CurrentUserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
      required:
        - data
    AccessLevel:
      type: string
      enum: [owner, edit, view]
    Document:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: >-
            Nome do documento. Um documento novo nasce como
            "documento-sem-titulo-N", N o menor inteiro livre entre os
            documentos do dono.
        spaceId:
          type: string
        authorId:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accessLevel:
          $ref: "#/components/schemas/AccessLevel"
        trashedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Quando o documento foi movido para a lixeira; nulo se não está
            nela.
        isFavorite:
          type: boolean
          description: Se a pessoa da sessão marcou o documento como favorito.
      required:
        - id
        - title
        - spaceId
        - authorId
        - ownerId
        - createdAt
        - updatedAt
        - trashedAt
        - accessLevel
        - isFavorite
    DocumentSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        trashedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Quando o documento foi movido para a lixeira; nulo se não está
            nela.
      required:
        - id
        - title
        - updatedAt
        - trashedAt
    DocumentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Document"
      required:
        - data
    CreateDocumentInput:
      type: object
      properties:
        spaceId:
          type: string
          description: >-
            Espaço de unidade onde o documento nasce. Ausente, o documento
            nasce no espaço pessoal de quem chama.
      additionalProperties: false
    DocumentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
      required:
        - data
    OrgUnit:
      type: object
      properties:
        id:
          type: string
          description: Identificador da unidade.
        parentId:
          type: [string, "null"]
          description: Unidade pai; nulo na raiz da organização.
        name:
          type: string
          description: Nome da unidade.
        spaceAccess:
          type: string
          enum: [own, inherit]
          description: >-
            Quem vê o espaço da unidade: só os lotados nela (own) ou também
            quem vê o espaço da unidade-pai (inherit).
      required:
        - id
        - parentId
        - name
        - spaceAccess
    OrgUnitsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
      required:
        - data
    OrgUnitResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OrgUnit"
      required:
        - data
    CreateOrgUnitInput:
      type: object
      properties:
        parentId:
          type: string
          description: Unidade mãe da unidade nova.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Nome da unidade, aparado e único entre as irmãs sem diferenciar
            maiúsculas de minúsculas.
      required:
        - parentId
        - name
      additionalProperties: false
    UpdateOrgUnitInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Novo nome da unidade, aparado e único entre as irmãs sem
            diferenciar maiúsculas de minúsculas. Na raiz, passa a ser também
            o nome da organização.
      required:
        - name
      additionalProperties: false
    UpdateOrgUnitSpaceInput:
      type: object
      properties:
        access:
          type: string
          enum: [own, inherit]
          description: >-
            Quem vê o espaço da unidade: só os lotados nela (own) ou também
            quem vê o espaço da unidade-pai (inherit).
      required:
        - access
      additionalProperties: false
    AssignedPerson:
      type: object
      properties:
        id:
          type: string
          description: Identificador da pessoa.
        name:
          type: string
          description: Nome da pessoa.
        email:
          type: string
          description: >-
            E-mail da pessoa; quem lê é sempre a administração, e é ele que
            distingue dois nomes iguais.
      required:
        - id
        - name
        - email
    OrgUnitSummary:
      type: object
      properties:
        id:
          type: string
          description: Identificador da unidade.
        name:
          type: string
          description: Nome da unidade.
      required:
        - id
        - name
    AssignedPeopleResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AssignedPerson"
        orgUnit:
          $ref: "#/components/schemas/OrgUnitSummary"
      required:
        - data
        - orgUnit
    AssignedPersonResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AssignedPerson"
      required:
        - data
    AssignPersonRequest:
      type: object
      properties:
        personId:
          type: string
          minLength: 1
          description: Identificador da pessoa a lotar na unidade.
      required:
        - personId
      additionalProperties: false
    PersonSummary:
      type: object
      properties:
        id:
          type: string
          description: Identificador da pessoa.
        name:
          type: string
          description: Nome da pessoa.
        email:
          type: string
          description: E-mail da pessoa.
      required:
        - id
        - name
        - email
    PeopleResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PersonSummary"
        hasMore:
          type: boolean
          description: >-
            Verdadeiro quando há mais pessoas casando o termo do que as
            mostradas.
      required:
        - data
        - hasMore
    AdminPerson:
      type: object
      properties:
        id:
          type: string
          description: Identificador da pessoa.
        name:
          type: string
          description: Nome da pessoa.
        email:
          type: string
          description: E-mail da pessoa; distingue duas pessoas com o mesmo nome.
      required:
        - id
        - name
        - email
    AdminsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminPerson"
      required:
        - data
    AdminResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AdminPerson"
      required:
        - data
    Space:
      type: object
      properties:
        id:
          type: string
          description: Identificador do espaço (não da unidade).
        type:
          type: string
          enum:
            - unit
            - free
          description: Tipo do espaço, de unidade ou livre.
        name:
          type: string
          description: >-
            Nome da unidade, no espaço de unidade; nome dado pelo dono, no
            espaço livre.
      required:
        - id
        - type
        - name
      additionalProperties: false
    SpacesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Space"
      required:
        - data
    SpaceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Space"
      required:
        - data
    SpaceDetail:
      type: object
      properties:
        id:
          type: string
          description: Identificador do espaço (não da unidade).
        type:
          type: string
          enum:
            - unit
            - free
          description: Tipo do espaço, de unidade ou livre.
        name:
          type: string
          description: >-
            Nome da unidade, no espaço de unidade; nome dado pelo dono, no
            espaço livre.
        reach:
          type: string
          enum:
            - direct
            - inherited
            - owner
            - member
          description: >-
            Como quem chama alcança o espaço: lotação direta na unidade,
            herança entre unidades, dono do espaço livre ou membro do espaço
            livre.
        membersCanInvite:
          type: boolean
          description: >-
            Se qualquer membro pode adicionar pessoas ao espaço livre; sempre
            false em espaço de unidade.
        canCreateDocuments:
          type: boolean
          description: >-
            Se quem pede pode criar documentos neste espaço; verdadeiro para
            todo alcance de espaço de unidade (direto ou herdado).
        canAddPeople:
          type: boolean
          description: >-
            Se quem pede pode adicionar pessoas; permissão calculada, diferente
            da configuração membersCanInvite.
      required:
        - id
        - type
        - name
        - reach
        - membersCanInvite
        - canCreateDocuments
        - canAddPeople
      additionalProperties: false
    SpaceDetailResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SpaceDetail"
      required:
        - data
    SpaceMember:
      type: object
      properties:
        id:
          type: string
          description: Identificador da pessoa.
        name:
          type: string
        email:
          type: string
        isCurrentPerson:
          type: boolean
          description: Verdadeiro na linha de quem chama.
        role:
          type: string
          enum:
            - owner
            - member
            - assigned
          description: >-
            Papel da pessoa no espaço: `owner` é o dono do espaço livre,
            `member` é membro do espaço livre e `assigned` é lotada na unidade
            do espaço de unidade.
        level:
          type: [string, "null"]
          enum:
            - view
            - edit
            - null
          description: >-
            Nível do membro no espaço livre; null para o dono e para lotados
            de unidade.
      required:
        - id
        - name
        - email
        - isCurrentPerson
        - role
        - level
      additionalProperties: false
    SpaceMembersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpaceMember"
      required:
        - data
    SpaceMemberResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PersonSummary"
      required:
        - data
      additionalProperties: false
    SpaceMemberLevelResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SpaceMember"
      required:
        - data
    UpdateSpaceMemberInput:
      type: object
      properties:
        level:
          type: string
          enum:
            - view
            - edit
          description: >-
            "edit" para criar e editar documentos; "view" para só ler.
      required:
        - level
      additionalProperties: false
    CreateSpaceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nome do espaço livre, contado depois de aparar os espaços.
      required:
        - name
      additionalProperties: false
    UpdateSpaceInput:
      type: object
      properties:
        membersCanInvite:
          type: boolean
          description: >-
            Verdadeiro para qualquer membro adicionar pessoas; falso para só o
            dono.
      required:
        - membersCanInvite
      additionalProperties: false
    CreateInvitationInput:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >-
            E-mail de quem está sendo convidado, aparado e passado para
            minúsculas antes de gravar.
      required:
        - email
      additionalProperties: false
    CreatedInvitation:
      type: object
      properties:
        id:
          type: string
          description: Identificador do convite.
        email:
          type: string
          format: email
          description: E-mail convidado, já normalizado.
        expiresAt:
          type: string
          format: date-time
          description: Quando o convite deixa de valer; sete dias depois da criação.
        createdAt:
          type: string
          format: date-time
          description: Quando o convite foi criado.
        token:
          type: string
          description: >-
            Token do convite em claro. Devolvido uma única vez, na criação; o
            servidor guarda só o hash e não tem como mostrá-lo de novo.
      required:
        - id
        - email
        - expiresAt
        - createdAt
        - token
    CreatedInvitationResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CreatedInvitation"
      required:
        - data
    Invitation:
      type: object
      properties:
        id:
          type: string
          description: Identificador do convite.
        email:
          type: string
          format: email
          description: E-mail convidado, já normalizado.
        createdAt:
          type: string
          format: date-time
          description: Quando o convite foi criado.
        expiresAt:
          type: string
          format: date-time
          description: Quando o convite deixa de valer.
      required:
        - id
        - email
        - createdAt
        - expiresAt
    InvitationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
      required:
        - data
    InvitationPreview:
      type: object
      properties:
        email:
          type: string
          format: email
          description: E-mail convidado, o mesmo que a conta nova terá.
        organizationName:
          type: string
          description: Nome da organização que convidou.
      required:
        - email
        - organizationName
      additionalProperties: false
    InvitationPreviewResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InvitationPreview"
      required:
        - data
    AcceptInvitationInput:
      type: object
      properties:
        name:
          type: string
          description: Nome de quem está criando a conta, aparado antes de gravar.
        password:
          type: string
          description: Senha escolhida, de 12 a 128 caracteres.
      required:
        - name
        - password
      additionalProperties: false
    ShareDocumentInput:
      type: object
      properties:
        level:
          type: string
          enum: [view, edit]
          description: >-
            Nível de acesso dado à pessoa: "view" (Pode ver) ou "edit" (Pode
            editar).
      required: [level]
      additionalProperties: false
    DocumentShare:
      type: object
      properties:
        personId:
          type: string
          description: Identificador da pessoa com acesso.
        name:
          type: string
          description: Nome da pessoa.
        email:
          type: string
          description: E-mail da pessoa.
        level:
          type: string
          enum: [view, edit]
          description: >-
            Nível de acesso gravado para a pessoa: "view" (Pode ver) ou "edit"
            (Pode editar).
      required: [personId, name, email, level]
    DocumentShareResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DocumentShare"
      required: [data]
    DocumentAccessEntry:
      type: object
      properties:
        personId:
          type: string
          format: uuid
          description: Identificador da pessoa com acesso.
        name:
          type: string
          description: Nome da pessoa.
        email:
          type: string
          description: E-mail da pessoa.
        level:
          type: string
          enum: [owner, view, edit]
          description: Nível de acesso da pessoa; owner é o proprietário.
        isCurrentPerson:
          type: boolean
          description: Indica se a linha é de quem fez a consulta.
      required: [personId, name, email, level, isCurrentPerson]
    DocumentAccessListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentAccessEntry"
      required: [data]
    UpdateDocumentBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      additionalProperties: true
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
      required:
        - message
        - errors
