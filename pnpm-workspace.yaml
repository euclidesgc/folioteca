packages:
  - "apps/*"
  - "packages/*"

# Script de instalação roda só onde a dependência não funciona sem ele, e cada
# decisão é nomeada. Na linha 11 do pnpm, script de build ignorado é erro duro
# em vez de aviso: a decisão tem de ser de alguém, não da omissão.
#
# Recusados: `@scarf/scarf` é telemetria e não entra de jeito nenhum;
# `@parcel/watcher` e `unrs-resolver` são bindings nativos com caminho de
# reserva em JavaScript, e nada no projeto depende do ganho de desempenho deles.
# O script do `msw` instala o worker de service worker do navegador, e a web usa
# só `msw/node`.
#
# Liberados: `prisma` e `@prisma/engines` posicionam no postinstall o motor de
# consulta nativo. Sem ele o cliente não conecta e migration nenhuma roda — é a
# condição de o Prisma existir, não um ganho de desempenho.
#
# `cpu-features`, `protobufjs` e `ssh2` entraram em 12/09/2026 com
# `testcontainers`/`@testcontainers/postgresql` (etapa 3 do plano 02): os três
# chegam via `dockerode`, que fala com o daemon do Docker local — `ssh2` é só
# para tunelar um Docker remoto por SSH, `cpu-features` só acelera a criptografia
# do `ssh2`, e `protobufjs` serve um cliente gRPC que `dockerode` nem importa no
# caminho do socket Unix local. Nenhum dos três tem script de build exigido pelo
# uso que a suíte de integração faz (contêiner no Docker local da máquina).
allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  unrs-resolver: false
  msw: false
  "@prisma/engines": true
  prisma: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# `js-yaml` 4.2.0 entra por `@hey-api/openapi-ts` e carrega dois avisos de
# negação de serviço por análise quadrática. O gerador só lê `apps/api/openapi.json`,
# que é nosso e é JSON, então não há entrada hostil hoje — e é justamente por
# não haver que a correção é barata agora e cara no dia em que o contrato de um
# terceiro entrar no gerador.
overrides:
  js-yaml: ">=4.3.2"
  # `multer` chega por `@nestjs/platform-express`, que é dependência de produção
  # da API: ele lê o corpo multipart de toda requisição de upload. Em 08/09/2026 a
  # auditoria do lockfile passou a devolver TRÊS achados de severidade alta sobre
  # `multer@2.2.0` — GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf e
  # GHSA-535w-7cp7-47q4 —, e nada no repositório havia mudado: os avisos são que
  # são novos.
  #
  # A correção sobe para `2.3.0`, publicada em 2026-08-28 e com onze dias no dia
  # em que este override entrou, portanto fora da quarentena de sete dias. Ela
  # fecha dois dos três avisos; o terceiro ainda não declara versão corrigida, e
  # é por isso que o piso é `>=2.3.0` e não uma versão fixa — quando a correção
  # do terceiro sair, ela entra sozinha.
  #
  # O override existe porque a correção mora numa dependência transitiva: subir
  # `@nestjs/platform-express` esperaria o NestJS republicar, e o caminho é de
  # produção.
  multer: ">=2.3.0"

  # `deepmerge-ts` e `mysql2` entraram em 10/09/2026 com o Prisma e o Better
  # Auth — o primeiro por `@prisma/config`, o segundo porque o Better Auth
  # carrega os drivers de todos os bancos que suporta. A auditoria acusou os
  # dois como severidade alta: GHSA-ggr8-5vv4-36mx e GHSA-3f6p-5ww8-9rcr.
  #
  # Nenhum dos dois é alcançado pelo nosso código: o banco é Postgres, e o
  # driver MySQL nunca é carregado. É por isso que o piso sobe em vez de a
  # dependência ser trocada — não há caminho de execução a mudar, só um lockfile
  # que declara versão vulnerável e um portão que, com razão, não distingue
  # dependência alcançada de dependência presente.
  deepmerge-ts: ">=8.0.0"
  mysql2: ">=3.22.0"

# Versão publicada há menos de sete dias não entra na resolução. As campanhas
# recentes de publicação maliciosa em npm foram detectadas e despublicadas
# dentro dessa janela, e é dela que a espera tira o número: 10080 minutos. Mais
# que isso começa a atrasar correção de segurança legítima, que também chega por
# versão nova. Quem for tentado a baixar o valor precisa encontrar o argumento
# aqui, junto do número — e `scripts/gates/quarentena.sh` compara a leitura de
# `pnpm config get minimumReleaseAge` com ele, porque `undefined` não distingue
# "não configurei" de "troquei um caractere".
minimumReleaseAge: 10080
