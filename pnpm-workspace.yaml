packages:
  - "apps/*"
  - "packages/*"

# Nenhuma dependência roda script de instalação, e a recusa é nomeada. Na linha
# 11 do pnpm, script de build ignorado é erro duro em vez de aviso: a decisão
# tem de ser de alguém, não da omissão. `@scarf/scarf` é telemetria e não entra
# de jeito nenhum; `@parcel/watcher` e `unrs-resolver` são bindings nativos com
# caminho de reserva em JavaScript, e nada no projeto depende do ganho de
# desempenho deles. O script do `msw` instala o worker de service worker do
# navegador, e a web usa só `msw/node`.
allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  unrs-resolver: false
  msw: false

# `js-yaml` 4.2.0 entra por `@hey-api/openapi-ts` e carrega dois avisos de
# negação de serviço por análise quadrática. O gerador só lê `apps/api/openapi.json`,
# que é nosso e é JSON, então não há entrada hostil hoje — e é justamente por
# não haver que a correção é barata agora e cara no dia em que o contrato de um
# terceiro entrar no gerador.
overrides:
  js-yaml: ">=4.3.2"
  # `multer` chega por `@nestjs/platform-express`, que é dependência de produção
  # da API: ele lê o corpo multipart de toda requisição de upload. Em 08/09/2026 a
  # auditoria do lockfile passou a devolver TRÊS achados de severidade alta sobre
  # `multer@2.2.0` — GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf e
  # GHSA-535w-7cp7-47q4 —, e nada no repositório havia mudado: os avisos são que
  # são novos.
  #
  # A correção sobe para `2.3.0`, publicada em 2026-08-28 e com onze dias no dia
  # em que este override entrou, portanto fora da quarentena de sete dias. Ela
  # fecha dois dos três avisos; o terceiro ainda não declara versão corrigida, e
  # é por isso que o piso é `>=2.3.0` e não uma versão fixa — quando a correção
  # do terceiro sair, ela entra sozinha.
  #
  # O override existe porque a correção mora numa dependência transitiva: subir
  # `@nestjs/platform-express` esperaria o NestJS republicar, e o caminho é de
  # produção.
  multer: ">=2.3.0"

# Versão publicada há menos de sete dias não entra na resolução. As campanhas
# recentes de publicação maliciosa em npm foram detectadas e despublicadas
# dentro dessa janela, e é dela que a espera tira o número: 10080 minutos. Mais
# que isso começa a atrasar correção de segurança legítima, que também chega por
# versão nova. Quem for tentado a baixar o valor precisa encontrar o argumento
# aqui, junto do número — e `scripts/gates/quarentena.sh` compara a leitura de
# `pnpm config get minimumReleaseAge` com ele, porque `undefined` não distingue
# "não configurei" de "troquei um caractere".
minimumReleaseAge: 10080
